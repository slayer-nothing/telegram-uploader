name: YouTube Downloader & Uploader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL"
        required: true
        type: string

      download_type:
        description: "Download type"
        required: true
        type: choice
        options:
          - video
          - audio

      quality:
        description: "Video quality"
        required: true
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480

      processing_mode:
        description: "Video processing mode"
        required: true
        type: choice
        options:
          - original
          - telegram

jobs:
  youtube-download-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ==========================================
      # INSTALL
      # ==========================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs
          python -m pip install --upgrade pip
          pip install -U yt-dlp telethon cryptg

      # ==========================================
      # YOUTUBE COOKIES
      # ==========================================

      - name: Create YouTube cookies file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > youtube-cookies.txt
          chmod 600 youtube-cookies.txt

          if [ ! -s youtube-cookies.txt ]; then
            echo "ERROR: YouTube cookies file is empty."
            exit 1
          fi

          echo "YouTube cookies loaded."

      # ==========================================
      # DOWNLOAD
      # ==========================================

      - name: Download from YouTube
        env:
          YOUTUBE_URL: ${{ inputs.url }}
          DOWNLOAD_TYPE: ${{ inputs.download_type }}
          QUALITY: ${{ inputs.quality }}
        run: |

          mkdir -p downloads

          echo "========================================"
          echo "YouTube Downloader"
          echo "========================================"

          echo "Type: $DOWNLOAD_TYPE"
          echo "Quality: $QUALITY"

          # --------------------------------------
          # GET VIDEO INFORMATION
          # --------------------------------------

          echo ""
          echo "Getting video information..."

          yt-dlp \
            --cookies youtube-cookies.txt \
            --js-runtimes node \
            --remote-components ejs:github \
            --no-playlist \
            --print "%(title)s" \
            --print "%(webpage_url)s" \
            --skip-download \
            "$YOUTUBE_URL" > youtube_info_raw.txt

          TITLE=$(sed -n '1p' youtube_info_raw.txt)
          VIDEO_URL=$(sed -n '2p' youtube_info_raw.txt)

          echo ""
          echo "Title:"
          echo "$TITLE"

          echo ""
          echo "URL:"
          echo "$VIDEO_URL"

          printf '%s' "$TITLE" > youtube_title.txt
          printf '%s' "$VIDEO_URL" > youtube_url.txt

          # --------------------------------------
          # DOWNLOAD VIDEO
          # --------------------------------------

          if [ "$DOWNLOAD_TYPE" = "video" ]; then

            if [ "$QUALITY" = "best" ]; then
              FORMAT="bestvideo*+bestaudio/best"

            elif [ "$QUALITY" = "2160" ]; then
              FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]"

            elif [ "$QUALITY" = "1440" ]; then
              FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]"

            elif [ "$QUALITY" = "1080" ]; then
              FORMAT="bestvideo[height<=1080]+bestaudio/best[height<=1080]"

            elif [ "$QUALITY" = "720" ]; then
              FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]"

            elif [ "$QUALITY" = "480" ]; then
              FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]"
            fi

            echo ""
            echo "Format: $FORMAT"
            echo ""
            echo "Downloading video + audio..."

            yt-dlp \
              --cookies youtube-cookies.txt \
              --js-runtimes node \
              --remote-components ejs:github \
              --newline \
              --progress \
              --no-playlist \
              -f "$FORMAT" \
              --merge-output-format mp4 \
              -o "downloads/%(title)s.%(ext)s" \
              "$YOUTUBE_URL"

          # --------------------------------------
          # DOWNLOAD AUDIO
          # --------------------------------------

          else

            echo ""
            echo "Downloading best audio..."

            yt-dlp \
              --cookies youtube-cookies.txt \
              --js-runtimes node \
              --remote-components ejs:github \
              --newline \
              --progress \
              --no-playlist \
              -f "bestaudio/best" \
              --extract-audio \
              --audio-format mp3 \
              --audio-quality 0 \
              -o "downloads/%(title)s.%(ext)s" \
              "$YOUTUBE_URL"

          fi

          echo ""
          echo "Download completed."

          ls -lh downloads

      # ==========================================
      # PROCESS VIDEO
      # ==========================================

      - name: Process video
        if: inputs.download_type == 'video'
        env:
          PROCESSING_MODE: ${{ inputs.processing_mode }}
        run: |

          FILE=$(find downloads -maxdepth 1 -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No downloaded video found."
            exit 1
          fi

          echo "========================================"
          echo "Video Processing"
          echo "========================================"

          echo "Mode: $PROCESSING_MODE"
          echo "File: $(basename "$FILE")"

          VIDEO_CODEC=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FILE")

          AUDIO_CODEC=$(ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FILE")

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FILE")

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FILE")

          FPS=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=r_frame_rate \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FILE")

          FORMAT_NAME=$(ffprobe \
            -v error \
            -show_entries format=format_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FILE")

          echo ""
          echo "Original information:"
          echo "Resolution: ${WIDTH}x${HEIGHT}"
          echo "FPS: $FPS"
          echo "Video codec: $VIDEO_CODEC"
          echo "Audio codec: $AUDIO_CODEC"
          echo "Format: $FORMAT_NAME"

          CONVERTED="No"

          # ======================================
          # ORIGINAL CODEC
          # ======================================

          if [ "$PROCESSING_MODE" = "original" ]; then

            echo ""
            echo "Original Codec mode selected."
            echo "No video re-encoding."

            FINAL_FILE="$FILE"

          # ======================================
          # TELEGRAM PREVIEW
          # ======================================

          else

            echo ""
            echo "Telegram Preview mode selected."

            NEED_CONVERSION=false

            if [ "$VIDEO_CODEC" != "h264" ]; then
              NEED_CONVERSION=true
            fi

            if [ "$AUDIO_CODEC" != "aac" ]; then
              NEED_CONVERSION=true
            fi

            if [[ "$FORMAT_NAME" != *"mp4"* ]]; then
              NEED_CONVERSION=true
            fi

            if [ "$NEED_CONVERSION" = "true" ]; then

              echo ""
              echo "Converting to H.264 + AAC..."

              OUTPUT="downloads/telegram_preview.mp4"

              ffmpeg \
                -y \
                -i "$FILE" \
                -map 0:v:0 \
                -map 0:a:0? \
                -c:v libx264 \
                -preset veryfast \
                -crf 18 \
                -c:a aac \
                -b:a 192k \
                -movflags +faststart \
                "$OUTPUT"

              rm -f "$FILE"

              FINAL_FILE="$OUTPUT"
              CONVERTED="Yes"

            else

              echo ""
              echo "Compatible codecs detected."

              OUTPUT="downloads/telegram_preview.mp4"

              ffmpeg \
                -y \
                -i "$FILE" \
                -c copy \
                -movflags +faststart \
                "$OUTPUT"

              rm -f "$FILE"

              FINAL_FILE="$OUTPUT"

            fi

          fi

          # ======================================
          # FINAL VIDEO INFO
          # ======================================

          VIDEO_CODEC=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_FILE")

          AUDIO_CODEC=$(ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_FILE")

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_FILE")

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_FILE")

          FPS=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=r_frame_rate \
            -of default=noprint_wrappers=1:nokey=1 \
            "$FINAL_FILE")

          FILE_SIZE=$(stat -c%s "$FINAL_FILE")

          FILE_SIZE_MB=$(awk \
            "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")

          echo ""
          echo "========================================"
          echo "FINAL VIDEO"
          echo "========================================"

          echo "Resolution: ${WIDTH}x${HEIGHT}"
          echo "FPS: $FPS"
          echo "Video codec: $VIDEO_CODEC"
          echo "Audio codec: $AUDIO_CODEC"
          echo "Processing mode: $PROCESSING_MODE"
          echo "Converted: $CONVERTED"
          echo "Size: ${FILE_SIZE_MB} MB"

          cat > video_info.txt <<EOF
          Resolution: ${WIDTH}x${HEIGHT}
          FPS: ${FPS}
          Video codec: ${VIDEO_CODEC}
          Audio codec: ${AUDIO_CODEC}
          Processing mode: ${PROCESSING_MODE}
          Converted: ${CONVERTED}
          Size: ${FILE_SIZE_MB} MB
          EOF

      # ==========================================
      # FINAL FILE
      # ==========================================

      - name: Find final file
        run: |

          FILE=$(find downloads -maxdepth 1 -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No final file found."
            exit 1
          fi

          echo "========================================"
          echo "Final file"
          echo "========================================"

          echo "File: $(basename "$FILE")"

          echo ""
          echo "Size:"
          du -h "$FILE"

      # ==========================================
      # UPLOAD TO TELEGRAM
      # ==========================================

      - name: Upload to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOWNLOAD_TYPE: ${{ inputs.download_type }}

        run: |

          cat > upload.py <<'PY'

          import os
          import glob
          import time
          import subprocess

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["TELEGRAM_API_ID"])
          api_hash = os.environ["TELEGRAM_API_HASH"]
          session = os.environ["TELEGRAM_SESSION"]
          target_id = int(os.environ["TELEGRAM_CHAT_ID"])
          download_type = os.environ["DOWNLOAD_TYPE"]

          files = [
              f
              for f in glob.glob("downloads/*")
              if os.path.isfile(f)
              and not f.endswith(".txt")
          ]

          if not files:
              raise RuntimeError(
                  "No downloaded file found."
              )

          file_path = files[0]

          file_name = os.path.basename(
              file_path
          )

          file_size = os.path.getsize(
              file_path
          )

          # ======================================
          # YOUTUBE INFO
          # ======================================

          title = "Unknown Title"
          video_url = "Unknown URL"

          if os.path.exists("youtube_title.txt"):

              with open(
                  "youtube_title.txt",
                  "r",
                  encoding="utf-8"
              ) as f:

                  title = f.read().strip()

          if os.path.exists("youtube_url.txt"):

              with open(
                  "youtube_url.txt",
                  "r",
                  encoding="utf-8"
              ) as f:

                  video_url = f.read().strip()

          # ======================================
          # CAPTION
          # ======================================

          caption = ""

          if download_type == "video":

              def get_probe(args):

                  try:

                      return subprocess.check_output(
                          args,
                          text=True
                      ).strip()

                  except Exception:

                      return "Unknown"

              video_codec = get_probe([
                  "ffprobe",
                  "-v", "error",
                  "-select_streams", "v:0",
                  "-show_entries",
                  "stream=codec_name",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  file_path
              ])

              audio_codec = get_probe([
                  "ffprobe",
                  "-v", "error",
                  "-select_streams", "a:0",
                  "-show_entries",
                  "stream=codec_name",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  file_path
              ])

              resolution = get_probe([
                  "ffprobe",
                  "-v", "error",
                  "-select_streams", "v:0",
                  "-show_entries",
                  "stream=width,height",
                  "-of",
                  "csv=s=x:p=0",
                  file_path
              ])

              fps = get_probe([
                  "ffprobe",
                  "-v", "error",
                  "-select_streams", "v:0",
                  "-show_entries",
                  "stream=r_frame_rate",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  file_path
              ])

              processing_mode = "Unknown"
              converted = "Unknown"

              if os.path.exists(
                  "video_info.txt"
              ):

                  with open(
                      "video_info.txt",
                      "r",
                      encoding="utf-8"
                  ) as f:

                      info = f.read()

                  for line in info.splitlines():

                      if line.startswith(
                          "Processing mode:"
                      ):

                          processing_mode = (
                              line.split(
                                  ":",
                                  1
                              )[1].strip()
                          )

                      elif line.startswith(
                          "Converted:"
                      ):

                          converted = (
                              line.split(
                                  ":",
                                  1
                              )[1].strip()
                          )

              caption = (
                  "🎬 YouTube Video\n\n"

                  f"📝 Title:\n"
                  f"{title}\n\n"

                  f"🔗 Source:\n"
                  f"{video_url}\n\n"

                  f"📐 Quality: {resolution}\n"
                  f"🎞 Video: {video_codec}\n"
                  f"🔊 Audio: {audio_codec}\n"
                  f"🎞 FPS: {fps}\n"
                  f"⚙️ Mode: {processing_mode}\n"
                  f"🔄 Converted: {converted}\n"
                  f"📦 Size: "
                  f"{file_size / 1024 / 1024:.2f} MB"
              )

          else:

              caption = (
                  "🎵 YouTube Audio\n\n"

                  f"📝 Title:\n"
                  f"{title}\n\n"

                  f"🔗 Source:\n"
                  f"{video_url}\n\n"

                  f"📦 Size: "
                  f"{file_size / 1024 / 1024:.2f} MB"
              )

          # ======================================
          # TELEGRAM
          # ======================================

          client = TelegramClient(
              StringSession(session),
              api_id,
              api_hash
          )

          async def main():

              print(
                  "Connecting to Telegram..."
              )

              await client.connect()

              if not await client.is_user_authorized():

                  raise RuntimeError(
                      "Telegram session is not authorized."
                  )

              print(
                  "Session authorized."
              )

              target = None

              async for dialog in client.iter_dialogs():

                  if (
                      dialog.entity
                      and
                      getattr(
                          dialog.entity,
                          "id",
                          None
                      ) == target_id
                  ):

                      target = dialog.entity
                      break

              if target is None:

                  raise RuntimeError(
                      f"Target user "
                      f"{target_id} was not found."
                  )

              print(
                  "Target found."
              )

              print(
                  "Starting upload..."
              )

              start_time = time.time()

              last_update = 0

              def progress(
                  current,
                  total
              ):

                  nonlocal last_update

                  now = time.time()

                  if (
                      now - last_update < 1
                      and current < total
                  ):

                      return

                  last_update = now

                  elapsed = (
                      now - start_time
                  )

                  if elapsed <= 0:

                      return

                  percent = (
                      current * 100 / total
                  )

                  speed = (
                      current
                      / 1024
                      / 1024
                  ) / elapsed

                  print(
                      f"\rUpload: "
                      f"{percent:6.2f}% | "
                      f"{speed:.2f} MB/s",
                      end="",
                      flush=True
                  )

              if download_type == "video":

                  await client.send_file(
                      target,
                      file_path,
                      caption=caption,
                      force_document=False,
                      supports_streaming=True,
                      progress_callback=progress
                  )

              else:

                  await client.send_file(
                      target,
                      file_path,
                      caption=caption,
                      force_document=False,
                      progress_callback=progress
                  )

              elapsed = (
                  time.time()
                  - start_time
              )

              average_speed = (
                  file_size
                  / 1024
                  / 1024
              ) / elapsed

              print()
              print()

              print(
                  "========================================"
              )

              print(
                  "UPLOAD COMPLETED!"
              )

              print(
                  f"Average speed: "
                  f"{average_speed:.2f} MB/s"
              )

              print(
                  f"Upload time: "
                  f"{elapsed:.1f} seconds"
              )

              print(
                  "========================================"
              )

              await client.disconnect()

          with client:

              client.loop.run_until_complete(
                  main()
              )

          PY

          python upload.py

      # ==========================================
      # CLEANUP
      # ==========================================

      - name: Cleanup
        if: always()
        run: |

          echo "Cleaning temporary files..."

          rm -rf downloads
          rm -f upload.py
          rm -f youtube-cookies.txt
          rm -f youtube_info_raw.txt
          rm -f youtube_title.txt
          rm -f youtube_url.txt
          rm -f video_info.txt

          echo "Cleanup completed."
