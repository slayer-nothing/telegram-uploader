name: Telegram Temporary Stream

on:
  workflow_dispatch:
    inputs:
      telegram_url:
        description: "Telegram public message URL"
        required: true
        type: string

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3-pip

          pip install telethon cryptg fastapi uvicorn

      - name: Install cloudflared
        run: |
          curl -L \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Download Telegram media
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_URL: ${{ inputs.telegram_url }}

        run: |

          cat > download.py <<'PY'
          import os
          import re
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession


          API_ID = int(os.environ["TELEGRAM_API_ID"])
          API_HASH = os.environ["TELEGRAM_API_HASH"]
          SESSION = os.environ["TELEGRAM_SESSION"]
          URL = os.environ["TELEGRAM_URL"]


          def parse_url(url):

              m = re.search(
                  r"https?://t\.me/(?:s/)?([^/?#]+)/(\d+)",
                  url
              )

              if not m:
                  raise ValueError("Invalid Telegram message URL")

              username = m.group(1)
              message_id = int(m.group(2))

              return username, message_id


          async def main():

              username, message_id = parse_url(URL)

              print(f"Telegram: @{username}")
              print(f"Message ID: {message_id}")

              client = TelegramClient(
                  StringSession(SESSION),
                  API_ID,
                  API_HASH
              )

              await client.start()

              message = await client.get_messages(
                  username,
                  ids=message_id
              )

              if not message:
                  raise RuntimeError("Telegram message not found")

              if not message.media:
                  raise RuntimeError("This message has no media")

              print("Media found.")

              filename = None

              if message.file:

                  if message.file.name:
                      filename = message.file.name
                      print(f"Original filename: {filename}")

                  if message.file.size:
                      print(
                          f"Telegram file size: "
                          f"{message.file.size / 1024 / 1024:.2f} MB"
                      )

              if not filename:
                  filename = "telegram_media"

              filename = os.path.basename(filename)

              print(f"Saving as: {filename}")
              print("Downloading...")

              downloaded = await client.download_media(
                  message,
                  file=filename
              )

              if not downloaded:
                  raise RuntimeError("Download failed")

              print(f"Downloaded file: {downloaded}")

              await client.disconnect()


          asyncio.run(main())
          PY

          python3 download.py

          echo ""
          echo "Downloaded files:"
          ls -lah

      - name: Detect media file
        run: |

          MEDIA_FILE=$(find . -maxdepth 1 -type f \
            ! -name "download.py" \
            ! -name "*.log" \
            | head -n 1)

          if [ -z "$MEDIA_FILE" ]; then
            echo "No downloaded media file found."
            exit 1
          fi

          MEDIA_FILE="${MEDIA_FILE#./}"

          echo "Media file detected:"
          echo "$MEDIA_FILE"

          echo "MEDIA_FILE=$MEDIA_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "File information:"
          file "$MEDIA_FILE"

          echo ""
          echo "File size:"
          ls -lh "$MEDIA_FILE"

      - name: Create streaming server
        run: |

          cat > server.py <<'PY'
          from fastapi import FastAPI, Request
          from fastapi.responses import StreamingResponse, Response
          import os
          import mimetypes


          app = FastAPI()

          VIDEO = os.environ["MEDIA_FILE"]

          file_size = os.path.getsize(VIDEO)

          mime_type, _ = mimetypes.guess_type(VIDEO)

          if not mime_type:
              mime_type = "application/octet-stream"


          @app.get("/")
          async def home():

              return {
                  "status": "online",
                  "file": os.path.basename(VIDEO),
                  "size": file_size,
                  "stream": "/media"
              }


          @app.get("/media")
          async def media(request: Request):

              range_header = request.headers.get("range")

              if not range_header:

                  def full_file():

                      with open(VIDEO, "rb") as f:

                          while True:

                              chunk = f.read(1024 * 1024)

                              if not chunk:
                                  break

                              yield chunk

                  return StreamingResponse(
                      full_file(),
                      media_type=mime_type,
                      headers={
                          "Content-Length": str(file_size),
                          "Accept-Ranges": "bytes",
                          "Content-Disposition": "inline"
                      }
                  )


              if not range_header.startswith("bytes="):

                  return Response(
                      status_code=416,
                      headers={
                          "Content-Range":
                              f"bytes */{file_size}"
                      }
                  )


              range_value = range_header.replace(
                  "bytes=",
                  "",
                  1
              )

              range_value = range_value.split(",")[0]

              start_str, end_str = range_value.split("-")


              if start_str:

                  start = int(start_str)

                  if end_str:
                      end = int(end_str)
                  else:
                      end = file_size - 1

              else:

                  suffix_length = int(end_str)

                  if suffix_length <= 0:
                      return Response(
                          status_code=416,
                          headers={
                              "Content-Range":
                                  f"bytes */{file_size}"
                          }
                      )

                  suffix_length = min(
                      suffix_length,
                      file_size
                  )

                  start = file_size - suffix_length
                  end = file_size - 1


              if start >= file_size or start > end:

                  return Response(
                      status_code=416,
                      headers={
                          "Content-Range":
                              f"bytes */{file_size}"
                      }
                  )


              end = min(
                  end,
                  file_size - 1
              )

              content_length = end - start + 1


              def range_file():

                  with open(VIDEO, "rb") as f:

                      f.seek(start)

                      remaining = content_length

                      while remaining > 0:

                          chunk_size = min(
                              1024 * 1024,
                              remaining
                          )

                          chunk = f.read(chunk_size)

                          if not chunk:
                              break

                          yield chunk

                          remaining -= len(chunk)


              return StreamingResponse(
                  range_file(),
                  status_code=206,
                  media_type=mime_type,
                  headers={
                      "Content-Length":
                          str(content_length),

                      "Content-Range":
                          f"bytes {start}-{end}/{file_size}",

                      "Accept-Ranges":
                          "bytes",

                      "Content-Disposition":
                          "inline"
                  }
              )


          if __name__ == "__main__":

              import uvicorn

              uvicorn.run(
                  app,
                  host="0.0.0.0",
                  port=8080
              )
          PY

          nohup python3 server.py > server.log 2>&1 &

          sleep 3

          echo "Server started."

      - name: Start Cloudflare Tunnel
        run: |

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8080 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          echo "Waiting for tunnel..."

          URL=""

          for i in {1..30}; do

            URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              cloudflared.log \
              | head -n 1)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2

          done

          if [ -z "$URL" ]; then

            echo "Could not get Cloudflare URL."

            cat cloudflared.log

            exit 1

          fi

          STREAM_URL="${URL}/media"

          echo ""
          echo "=========================================="
          echo "       TELEGRAM TEMPORARY STREAM"
          echo "=========================================="
          echo ""
          echo "File:"
          echo "$MEDIA_FILE"
          echo ""
          echo "Stream URL:"
          echo "$STREAM_URL"
          echo ""
          echo "VLC:"
          echo "$STREAM_URL"
          echo ""
          echo "=========================================="

          echo "STREAM_URL=$STREAM_URL" >> "$GITHUB_ENV"

      - name: Keep stream alive
        run: |

          echo "Stream is now available:"
          echo "$STREAM_URL"

          echo ""
          echo "Waiting for 30 minutes..."

          for i in {1..30}; do

            echo "[$i/30] Stream active..."

            sleep 60

          done
