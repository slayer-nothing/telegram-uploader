name: Telegram Temporary Stream

on:
  workflow_dispatch:
    inputs:
      telegram_url:
        description: "Telegram public message URL"
        required: true
        type: string

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      # =========================
      # Install dependencies
      # =========================
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3-pip

      - name: Install Python packages
        run: |
          pip install telethon cryptg fastapi uvicorn

      # =========================
      # Install Cloudflare Tunnel
      # =========================
      - name: Install cloudflared
        run: |
          curl -L \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      # =========================
      # Download Telegram video
      # =========================
      - name: Download Telegram video
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_URL: ${{ inputs.telegram_url }}
        run: |

          cat > download.py <<'PY'
          import os
          import re
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession


          API_ID = int(os.environ["TELEGRAM_API_ID"])
          API_HASH = os.environ["TELEGRAM_API_HASH"]
          SESSION = os.environ["TELEGRAM_SESSION"]
          URL = os.environ["TELEGRAM_URL"]


          def parse_url(url):

              m = re.search(
                  r"https?://t\.me/(?:s/)?([^/?#]+)/(\d+)",
                  url
              )

              if not m:
                  raise ValueError(
                      "Invalid Telegram message URL"
                  )

              username = m.group(1)
              message_id = int(m.group(2))

              return username, message_id


          async def main():

              username, message_id = parse_url(URL)

              print(f"Telegram: @{username}")
              print(f"Message ID: {message_id}")

              client = TelegramClient(
                  StringSession(SESSION),
                  API_ID,
                  API_HASH
              )

              await client.start()

              message = await client.get_messages(
                  username,
                  ids=message_id
              )

              if not message:
                  raise RuntimeError(
                      "Telegram message not found"
                  )

              if not message.media:
                  raise RuntimeError(
                      "This message has no media"
                  )

              print("Media found.")

              file_name = "telegram_original"

              if message.file:
                  if message.file.name:
                      print(
                          f"Original filename: {message.file.name}"
                      )

                  if message.file.size:
                      print(
                          f"Telegram file size: "
                          f"{message.file.size / 1024 / 1024:.2f} MB"
                      )

              print("Downloading...")

              await client.download_media(
                  message,
                  file=file_name
              )

              print("Download completed.")

              await client.disconnect()


          asyncio.run(main())
          PY

          python3 download.py

      # =========================
      # Convert to browser/VLC compatible MP4
      # =========================
      - name: Convert video to MP4
        run: |

          echo "Converting video..."

          ffmpeg \
            -y \
            -i telegram_original \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            video.mp4

          echo "Conversion completed."

          ls -lh video.mp4

      # =========================
      # Create streaming server
      # =========================
      - name: Create streaming server
        run: |

          cat > server.py <<'PY'
          from fastapi import FastAPI, Request
          from fastapi.responses import StreamingResponse
          import os


          app = FastAPI()

          VIDEO = "video.mp4"


          @app.get("/")
          async def home():

              return {
                  "status": "online",
                  "stream": "/video.mp4"
              }


          @app.get("/video.mp4")
          async def video(request: Request):

              file_size = os.path.getsize(VIDEO)

              range_header = request.headers.get("range")

              if not range_header:

                  def full_file():

                      with open(VIDEO, "rb") as f:

                          while True:

                              chunk = f.read(1024 * 1024)

                              if not chunk:
                                  break

                              yield chunk

                  return StreamingResponse(
                      full_file(),
                      media_type="video/mp4",
                      headers={
                          "Content-Length": str(file_size),
                          "Accept-Ranges": "bytes",
                          "Content-Disposition": "inline"
                      }
                  )


              # Parse HTTP Range

              range_value = range_header.replace(
                  "bytes=",
                  ""
              )

              start, end = range_value.split("-")

              start = int(start)

              if end:
                  end = int(end)
              else:
                  end = file_size - 1


              if start >= file_size:

                  return StreamingResponse(
                      iter(()),
                      status_code=416,
                      headers={
                          "Content-Range":
                              f"bytes */{file_size}"
                      }
                  )


              end = min(end, file_size - 1)

              content_length = end - start + 1


              def range_file():

                  with open(VIDEO, "rb") as f:

                      f.seek(start)

                      remaining = content_length

                      while remaining > 0:

                          chunk_size = min(
                              1024 * 1024,
                              remaining
                          )

                          chunk = f.read(chunk_size)

                          if not chunk:
                              break

                          yield chunk

                          remaining -= len(chunk)


              return StreamingResponse(
                  range_file(),
                  status_code=206,
                  media_type="video/mp4",
                  headers={
                      "Content-Length":
                          str(content_length),

                      "Content-Range":
                          f"bytes {start}-{end}/{file_size}",

                      "Accept-Ranges": "bytes",

                      "Content-Disposition":
                          "inline"
                  }
              )


          if __name__ == "__main__":

              import uvicorn

              uvicorn.run(
                  app,
                  host="0.0.0.0",
                  port=8080
              )
          PY

          nohup python3 server.py > server.log 2>&1 &

          sleep 3

          echo "Server started."

      # =========================
      # Start Cloudflare Tunnel
      # =========================
      - name: Start Cloudflare Tunnel
        run: |

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8080 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          echo "Waiting for tunnel..."

          for i in {1..30}; do

            URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              cloudflared.log | head -n 1)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2

          done


          if [ -z "$URL" ]; then

            echo "Could not get Cloudflare URL."

            cat cloudflared.log

            exit 1

          fi


          STREAM_URL="${URL}/video.mp4"


          echo ""
          echo "=========================================="
          echo "        TELEGRAM TEMPORARY STREAM"
          echo "=========================================="
          echo ""
          echo "Browser:"
          echo "$STREAM_URL"
          echo ""
          echo "VLC:"
          echo "$STREAM_URL"
          echo ""
          echo "=========================================="
          echo "The link is active while this job is running."
          echo "=========================================="
          echo ""

          echo "STREAM_URL=$STREAM_URL" >> "$GITHUB_ENV"

      # =========================
      # Keep server alive
      # =========================
      - name: Keep stream alive
        run: |

          echo "Stream is now available:"
          echo "$STREAM_URL"

          echo ""
          echo "Waiting for 30 minutes..."

          for i in {1..30}; do

            echo "[$i/30] Stream active..."

            sleep 60

          done
