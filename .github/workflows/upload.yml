name: Telegram File Uploader

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct download link"
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Download file
        run: |
          wget -O downloaded_file "$FILE_URL"
        env:
          FILE_URL: ${{ inputs.file_url }}

      - name: Upload to Telegram
        run: |
          curl -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F document="@downloaded_file" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"

      - name: Delete file
        if: always()
        run: |
          rm -f downloaded_file
