name: Telegram File Uploader

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct download URL"
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download file
        env:
          FILE_URL: ${{ inputs.file_url }}
        run: |
          mkdir -p downloads

          aria2c \
            --max-connection-per-server=8 \
            --split=8 \
            --min-split-size=10M \
            --continue=true \
            --file-allocation=none \
            --summary-interval=10 \
            --console-log-level=notice \
            --out=downloads/file \
            "$FILE_URL"

      - name: Show file information
        run: |
          echo "Downloaded file:"
          ls -lh downloads/file

      - name: Upload to Telegram
        run: |
          curl --fail-with-body \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document="@downloads/file" \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"

      - name: Cleanup
        if: always()
        run: |
          rm -rf downloads
