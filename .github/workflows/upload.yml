```yaml
name: Telegram File Uploader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct file URL"
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl
          python -m pip install --upgrade pip
          pip install telethon cryptg

      # ========================================
      # TEST URL WITH CHROME-LIKE REQUEST
      # ========================================

      - name: Test download URL
        env:
          FILE_URL: ${{ inputs.url }}
        run: |
          echo "========================================"
          echo "Testing download URL..."
          echo "========================================"

          echo ""
          echo "URL:"
          echo "$FILE_URL"
          echo ""

          echo "========================================"
          echo "HTTP RESPONSE"
          echo "========================================"

          curl -IL \
            --max-time 30 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36" \
            --referer "https://soft98.ir/" \
            "$FILE_URL" || true

          echo ""
          echo "========================================"
          echo "BODY TEST"
          echo "========================================"

          curl -L \
            --max-time 30 \
            --range 0-1023 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36" \
            --referer "https://soft98.ir/" \
            -o /tmp/url_test \
            -w "HTTP Status: %{http_code}\nContent-Type: %{content_type}\nContent-Length: %{size_download} bytes\nFinal URL: %{url_effective}\n" \
            "$FILE_URL" || true

          echo ""
          echo "Test completed."

      # ========================================
      # CHROME-LIKE FULL DOWNLOAD TEST
      # ========================================

      - name: Test full download with curl
        env:
          FILE_URL: ${{ inputs.url }}
        run: |
          echo "========================================"
          echo "Testing full download with curl..."
          echo "========================================"

          rm -f /tmp/test.zip

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 15 \
            --max-time 600 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7" \
            -H "Accept-Language: en-US,en;q=0.9,fa;q=0.8" \
            -H "Sec-Fetch-Dest: document" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-Site: none" \
            -H "Sec-Fetch-User: ?1" \
            -H "Upgrade-Insecure-Requests: 1" \
            -o /tmp/test.zip \
            "$FILE_URL"

          echo ""
          echo "========================================"
          echo "CURL DOWNLOAD SUCCESSFUL!"
          echo "========================================"

          ls -lh /tmp/test.zip

      # ========================================
      # ARIA2 DOWNLOAD
      # ========================================

      - name: Download file
        env:
          FILE_URL: ${{ inputs.url }}
        run: |
          mkdir -p downloads

          echo "========================================"
          echo "Starting aria2 download..."
          echo "========================================"

          aria2c \
            --dir=downloads \
            --continue=true \
            --auto-file-renaming=false \
            --allow-overwrite=true \
            --file-allocation=none \
            --split=8 \
            --max-connection-per-server=8 \
            --min-split-size=10M \
            --max-tries=10 \
            --retry-wait=3 \
            --connect-timeout=10 \
            --timeout=60 \
            --download-result=full \
            --summary-interval=5 \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36" \
            --referer="https://soft98.ir/" \
            "$FILE_URL"

          echo ""
          echo "========================================"
          echo "Download completed!"
          echo "========================================"

          ls -lh downloads

      # ========================================
      # SHOW FILE
      # ========================================

      - name: Show downloaded file
        run: |
          FILE=$(find downloads -maxdepth 1 -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No file found."
            exit 1
          fi

          echo "File: $(basename "$FILE")"
          echo "Size:"
          du -h "$FILE"

      # ========================================
      # UPLOAD TO TELEGRAM
      # ========================================

      - name: Upload to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > upload.py <<'PY'
          import os
          import glob
          import time

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["TELEGRAM_API_ID"])
          api_hash = os.environ["TELEGRAM_API_HASH"]
          session = os.environ["TELEGRAM_SESSION"]
          target_id = int(os.environ["TELEGRAM_CHAT_ID"])

          files = [
              f for f in glob.glob("downloads/*")
              if os.path.isfile(f)
          ]

          if not files:
              raise RuntimeError("No downloaded file found.")

          if len(files) > 1:
              print("Multiple files found. Using the first one.")

          file_path = files[0]
          file_name = os.path.basename(file_path)
          file_size = os.path.getsize(file_path)

          print("========================================")
          print(f"File: {file_name}")
          print(f"Size: {file_size / 1024 / 1024:.2f} MB")
          print("========================================")

          client = TelegramClient(
              StringSession(session),
              api_id,
              api_hash
          )

          async def main():

              print("Connecting to Telegram...")

              await client.connect()

              if not await client.is_user_authorized():
                  raise RuntimeError(
                      "Telegram session is not authorized."
                  )

              print("Session authorized.")

              print("Searching for target user...")

              target = None

              async for dialog in client.iter_dialogs():

                  if (
                      dialog.entity
                      and getattr(dialog.entity, "id", None)
                      == target_id
                  ):
                      target = dialog.entity
                      break

              if target is None:
                  raise RuntimeError(
                      f"Target user {target_id} was not found "
                      "in the uploader account's dialogs."
                  )

              print(
                  f"Target found: "
                  f"{getattr(target, 'first_name', '')}"
              )

              print()
              print("Starting Telegram upload...")
              print()

              start_time = time.time()
              last_update = 0

              def progress(current, total):

                  nonlocal last_update

                  now = time.time()

                  if now - last_update < 1 and current < total:
                      return

                  last_update = now

                  elapsed = now - start_time

                  if elapsed <= 0:
                      return

                  percent = current * 100 / total

                  speed = (
                      current / 1024 / 1024
                  ) / elapsed

                  uploaded_mb = (
                      current / 1024 / 1024
                  )

                  total_mb = (
                      total / 1024 / 1024
                  )

                  print(
                      f"\r"
                      f"Upload: {percent:6.2f}% | "
                      f"{uploaded_mb:.1f}/{total_mb:.1f} MB | "
                      f"{speed:.2f} MB/s",
                      end="",
                      flush=True
                  )

              await client.send_file(
                  target,
                  file_path,
                  force_document=True,
                  progress_callback=progress
              )

              elapsed = time.time() - start_time

              average_speed = (
                  file_size / 1024 / 1024
              ) / elapsed

              print()
              print()
              print("========================================")
              print("UPLOAD COMPLETED!")
              print("========================================")
              print(f"File: {file_name}")
              print(
                  f"Size: "
                  f"{file_size / 1024 / 1024:.2f} MB"
              )
              print(
                  f"Average upload speed: "
                  f"{average_speed:.2f} MB/s"
              )
              print(
                  f"Upload time: "
                  f"{elapsed:.1f} seconds"
              )
              print("========================================")

              await client.disconnect()

          with client:
              client.loop.run_until_complete(main())

          PY

          python upload.py

      # ========================================
      # VERIFY
      # ========================================

      - name: Verify upload step
        run: |
          echo "Telegram upload step completed successfully."

      # ========================================
      # CLEANUP
      # ========================================

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning temporary files..."
          rm -rf downloads
          rm -f upload.py
          rm -f /tmp/test.zip
          rm -f /tmp/url_test
          echo "Cleanup completed."
```
