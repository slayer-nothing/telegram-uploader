name: Telegram File Uploader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct file URL"
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          python -m pip install --upgrade pip
          pip install telethon

      - name: Download file
        env:
          FILE_URL: ${{ inputs.url }}
        run: |
          mkdir -p downloads

          aria2c \
            --dir=downloads \
            --split=8 \
            --max-connection-per-server=8 \
            --min-split-size=10M \
            --continue=true \
            --summary-interval=5 \
            "$FILE_URL"

      - name: Upload to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > upload.py <<'PY'
          import os
          import glob
          import time

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["TELEGRAM_API_ID"])
          api_hash = os.environ["TELEGRAM_API_HASH"]
          session = os.environ["TELEGRAM_SESSION"]
          chat_id = int(os.environ["TELEGRAM_CHAT_ID"])

          files = [
              f for f in glob.glob("downloads/*")
              if os.path.isfile(f)
          ]

          if not files:
              raise RuntimeError("No downloaded file found.")

          file_path = files[0]
          file_size = os.path.getsize(file_path)

          print(f"File: {os.path.basename(file_path)}")
          print(f"Size: {file_size / 1024 / 1024:.2f} MB")

          client = TelegramClient(
              StringSession(session),
              api_id,
              api_hash
          )

          start_time = time.time()

          def progress(current, total):
              elapsed = time.time() - start_time

              if elapsed <= 0:
                  return

              speed = current / 1024 / 1024 / elapsed
              percent = current * 100 / total

              print(
                  f"\rUpload: {percent:.1f}% | "
                  f"{speed:.2f} MB/s",
                  end="",
                  flush=True
              )

          async def main():
              await client.send_file(
                  chat_id,
                  file_path,
                  force_document=True,
                  progress_callback=progress
              )

          with client:
              client.loop.run_until_complete(main())

          elapsed = time.time() - start_time
          speed = file_size / 1024 / 1024 / elapsed

          print()
          print("Upload completed!")
          print(f"Average upload speed: {speed:.2f} MB/s")
          PY

          python upload.py

      - name: Cleanup
        if: always()
        run: |
          rm -rf downloads
