name: Telegram File Uploader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct file URL"
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          python -m pip install --upgrade pip
          pip install telethon

      - name: Download file
        env:
          FILE_URL: ${{ inputs.url }}
        run: |
          mkdir -p downloads

          aria2c \
            --dir=downloads \
            --split=8 \
            --max-connection-per-server=8 \
            --min-split-size=10M \
            --continue=true \
            --summary-interval=5 \
            "$FILE_URL"

      - name: Upload to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > upload.py <<'PY'
          import os
          import glob
          import time

          from telethon import TelegramClient
          from telethon.sessions import StringSession

          api_id = int(os.environ["TELEGRAM_API_ID"])
          api_hash = os.environ["TELEGRAM_API_HASH"]
          session = os.environ["TELEGRAM_SESSION"]
          target_id = int(os.environ["TELEGRAM_CHAT_ID"])

          files = [
              f for f in glob.glob("downloads/*")
              if os.path.isfile(f)
          ]

          if not files:
              raise RuntimeError("No downloaded file found.")

          file_path = files[0]
          file_size = os.path.getsize(file_path)

          print(f"File: {os.path.basename(file_path)}")
          print(f"Size: {file_size / 1024 / 1024:.2f} MB")

          client = TelegramClient(
              StringSession(session),
              api_id,
              api_hash
          )

          async def main():
              print("Connecting to Telegram...")
              await client.connect()

              if not await client.is_user_authorized():
                  raise RuntimeError("Telegram session is not authorized.")

              print("Session authorized.")
              print("Searching for target user...")

              target = None

              async for dialog in client.iter_dialogs():
                  if (
                      dialog.entity
                      and getattr(dialog.entity, "id", None) == target_id
                  ):
                      target = dialog.entity
                      break

              if target is None:
                  raise RuntimeError(
                      f"Target user {target_id} was not found in the "
                      "uploader account's dialogs. "
                      "Make sure the uploader account has an existing "
                      "chat with the target account."
                  )

              print(
                  f"Target found: "
                  f"{getattr(target, 'first_name', '')}"
              )

              start_time = time.time()

              def progress(current, total):
                  elapsed = time.time() - start_time

                  if elapsed <= 0:
                      return

                  speed = current / 1024 / 1024 / elapsed
                  percent = current * 100 / total

                  print(
                      f"\rUpload: {percent:.1f}% | "
                      f"{speed:.2f} MB/s",
                      end="",
                      flush=True
                  )

              print("Starting upload...")

              await client.send_file(
                  target,
                  file_path,
                  force_document=True,
                  progress_callback=progress
              )

              elapsed = time.time() - start_time
              speed = file_size / 1024 / 1024 / elapsed

              print()
              print("Upload completed!")
              print(f"Average upload speed: {speed:.2f} MB/s")

              await client.disconnect()

          with client:
              client.loop.run_until_complete(main())
          PY

          python upload.py

      - name: Cleanup
        if: always()
        run: |
          rm -rf downloads
