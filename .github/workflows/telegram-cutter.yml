name: Telegram Video Cutter

on:
  workflow_dispatch:
    inputs:
      telegram_url:
        description: "Telegram message URL"
        required: true
        type: string

      start_time:
        description: "Start time (HH:MM:SS)"
        required: true
        type: string

      end_time:
        description: "End time (HH:MM:SS)"
        required: true
        type: string

      file_name:
        description: "Output file name without extension"
        required: true
        type: string

      more_cuts:
        description: "Optional extra cuts from the same video: start,end,name; start,end,name"
        required: false
        default: ""
        type: string

jobs:
  cut-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TELEGRAM_URL: ${{ inputs.telegram_url }}
      START_TIME: ${{ inputs.start_time }}
      END_TIME: ${{ inputs.end_time }}
      OUTPUT_NAME: ${{ inputs.file_name }}
      MORE_CUTS: ${{ inputs.more_cuts }}
      MEDIA_FILE: input_media
      # Number of separate connections to the Telegram data center.
      # 1 = single connection only (the older, slower method).
      DOWNLOAD_CONNECTIONS: "8"
      # Total number of parallel requests, shared between the connections.
      DOWNLOAD_SEGMENTS: "16"

    steps:

      # ----------------------------------------
      # 1. Validate inputs (fail fast, before any download)
      # ----------------------------------------
      - name: Validate inputs
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys


          def fail(message):
              print(f"ERROR: {message}")
              sys.exit(1)


          # ---- helpers ----
          def check_name(name):
              if (
                  not name
                  or name != name.strip()
                  or len(name) > 120
                  or name[0] in "-."
                  or re.search(r'[\\/:*?"<>|,;\x00-\x1f]', name)
              ):
                  fail(
                      f"Invalid file name: {name!r}. "
                      "Do not use / \\ : * ? \" < > | , ; or control "
                      "characters, and do not start with '-' or '.'."
                  )


          time_pattern = re.compile(r"(\d{2}):(\d{2}):(\d{2}(?:\.\d+)?)")


          def to_seconds(label, value):
              m = time_pattern.fullmatch(value)

              if not m:
                  fail(f"Invalid {label} time: {value} (expected HH:MM:SS)")

              hours = int(m.group(1))
              minutes = int(m.group(2))
              seconds = float(m.group(3))

              if minutes >= 60 or seconds >= 60:
                  fail(f"Invalid {label} time: {value}")

              return hours * 3600 + minutes * 60 + seconds


          # ---- collect all cuts: the main one + optional extras ----
          cuts = [(
              os.environ["START_TIME"].strip(),
              os.environ["END_TIME"].strip(),
              os.environ["OUTPUT_NAME"],
          )]

          for part in re.split(r"[;\n]", os.environ.get("MORE_CUTS", "")):
              part = part.strip()

              if not part:
                  continue

              fields = [x.strip() for x in part.split(",")]

              if len(fields) != 3:
                  fail(
                      f"Invalid extra cut: {part!r}. "
                      "Expected: start,end,name"
                  )

              cuts.append((fields[0], fields[1], fields[2]))

          if len(cuts) > 30:
              fail("Too many cuts (maximum 30).")

          seen = set()
          lines = []

          print(f"Cuts: {len(cuts)}")

          for number, (start, end, name) in enumerate(cuts, start=1):
              check_name(name)

              if name.lower() in seen:
                  fail(f"Duplicate file name: {name}")

              seen.add(name.lower())

              start_seconds = to_seconds(f"start (cut {number})", start)
              end_seconds = to_seconds(f"end (cut {number})", end)

              if end_seconds <= start_seconds:
                  fail(
                      f"Cut {number}: end time must be greater "
                      "than start time."
                  )

              print(
                  f"  {number}. {start} -> {end} "
                  f"({end_seconds - start_seconds:.3f}s)  {name}.mp4"
              )

              lines.append(f"{start}\t{end}\t{name}\n")

          with open("cuts.txt", "w", encoding="utf-8") as f:
              f.writelines(lines)

          first_name = cuts[0][2]

          if len(cuts) == 1:
              artifact_name = first_name
          else:
              artifact_name = f"{first_name}_and_{len(cuts) - 1}_more"


          # ---- Telegram URL ----
          url = os.environ["TELEGRAM_URL"].strip()

          # Private channel/group: t.me/c/<id>/<msg> or t.me/c/<id>/<topic>/<msg>
          m = re.match(r"https?://t\.me/c/(\d+)/(?:\d+/)?(\d+)", url)

          if m:
              peer = "-100" + m.group(1)
              msg_id = m.group(2)
          else:
              # Public channel: t.me/<username>/<msg> (optionally /s/ or topic)
              m = re.match(
                  r"https?://t\.me/(?:s/)?([A-Za-z0-9_]+)/(?:\d+/)?(\d+)",
                  url,
              )

              if not m:
                  fail(
                      "Invalid Telegram URL. Expected: "
                      "https://t.me/username/message_id "
                      "or https://t.me/c/channel_id/message_id"
                  )

              peer = m.group(1)
              msg_id = m.group(2)

          print(f"Telegram peer: {peer}")
          print(f"Message ID: {msg_id}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"TG_PEER={peer}\n")
              f.write(f"TG_MSG_ID={msg_id}\n")
              f.write(f"ARTIFACT_NAME={artifact_name}\n")
          PY

      # ----------------------------------------
      # 2. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: |
          python3 -m pip install --quiet --break-system-packages \
            telethon \
            cryptg

          # ffmpeg is normally preinstalled on ubuntu-latest
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          ffmpeg -version | head -n 1

      # ----------------------------------------
      # 3. Download Telegram media (multi-connection + parallel)
      # ----------------------------------------
      - name: Download Telegram media
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |

          cat > download.py <<'PY'
          import asyncio
          import math
          import os
          import re
          import time

          from telethon import TelegramClient
          from telethon.errors import FloodWaitError
          from telethon.sessions import StringSession

          # These use Telethon internals. If anything is missing in a future
          # Telethon version, we simply fall back to the single-connection mode.
          try:
              from telethon import utils
              from telethon.network import MTProtoSender
              from telethon.tl.alltlobjects import LAYER
              from telethon.tl.functions import InvokeWithLayerRequest
              from telethon.tl.functions.auth import (
                  ExportAuthorizationRequest,
                  ImportAuthorizationRequest,
              )
              from telethon.tl.functions.upload import GetFileRequest

              MULTI_IMPORT_OK = True
          except ImportError as import_error:
              MULTI_IMPORT_OK = False
              print(f"Multi-connection imports unavailable: {import_error!r}")


          API_ID = int(os.environ["TELEGRAM_API_ID"])
          API_HASH = os.environ["TELEGRAM_API_HASH"]
          SESSION = os.environ["TELEGRAM_SESSION"]

          PEER_RAW = os.environ["TG_PEER"]
          PEER = int(PEER_RAW) if re.fullmatch(r"-?\d+", PEER_RAW) else PEER_RAW
          MSG_ID = int(os.environ["TG_MSG_ID"])

          OUT = os.environ["MEDIA_FILE"]
          SEGMENTS = max(1, int(os.environ.get("DOWNLOAD_SEGMENTS", "16")))
          CONNECTIONS = max(1, int(os.environ.get("DOWNLOAD_CONNECTIONS", "8")))

          CHUNK = 512 * 1024
          MAX_RETRIES = 5


          class Unsupported(Exception):
              """Raised for situations that retrying will not fix."""


          def format_size(size):
              if size < 1024 * 1024:
                  return f"{size / 1024:.1f} KB"

              if size < 1024 * 1024 * 1024:
                  return f"{size / (1024 * 1024):.2f} MB"

              return f"{size / (1024 * 1024 * 1024):.2f} GB"


          class Progress:

              def __init__(self, size):
                  self.size = size
                  self.done = 0
                  self.next_report = 10
                  self.started = time.monotonic()

              def add(self, amount):
                  self.done += amount
                  pct = self.done * 100 // self.size

                  if pct >= self.next_report:
                      elapsed = max(time.monotonic() - self.started, 0.001)
                      speed = self.done / elapsed / (1024 * 1024)
                      print(
                          f"Downloading: {pct}% "
                          f"({format_size(self.done)} / {format_size(self.size)}) "
                          f"- {speed:.1f} MB/s",
                          flush=True,
                      )
                      self.next_report = (pct // 10 + 1) * 10

              def finish(self):
                  if self.done != self.size:
                      raise RuntimeError(
                          f"Incomplete download: {self.done} of {self.size} bytes."
                      )

                  elapsed = max(time.monotonic() - self.started, 0.001)
                  print(
                      f"Download completed in {elapsed:.1f}s "
                      f"(average {self.size / elapsed / (1024 * 1024):.1f} MB/s)"
                  )


          async def run_all(tasks):
              try:
                  await asyncio.gather(*tasks)
              except BaseException:
                  for t in tasks:
                      t.cancel()
                  await asyncio.gather(*tasks, return_exceptions=True)
                  raise


          # ----------------------------------------
          # Method A: several connections to the data center
          # ----------------------------------------
          async def create_senders(client, dc_id, count):
              home_dc = client.session.dc_id == dc_id
              auth_key = client.session.auth_key if home_dc else None
              senders = []

              try:
                  for _ in range(count):
                      dc = await client._get_dc(dc_id)

                      sender = MTProtoSender(auth_key, loggers=client._log)

                      await sender.connect(
                          client._connection(
                              dc.ip_address,
                              dc.port,
                              dc.id,
                              loggers=client._log,
                              proxy=client._proxy,
                          )
                      )

                      if not auth_key:
                          # File is on another data center: authorize this
                          # connection there. The first sender creates the key,
                          # the rest reuse it.
                          auth = await client(ExportAuthorizationRequest(dc_id))
                          client._init_request.query = ImportAuthorizationRequest(
                              id=auth.id,
                              bytes=auth.bytes,
                          )
                          await sender.send(
                              InvokeWithLayerRequest(LAYER, client._init_request)
                          )
                          auth_key = sender.auth_key

                      senders.append(sender)

              except BaseException:
                  await asyncio.gather(
                      *[s.disconnect() for s in senders],
                      return_exceptions=True,
                  )
                  raise

              return senders


          async def multi_download(client, message, path, workers, connections):
              document = message.document
              size = document.size

              dc_id, location = utils.get_input_location(document)
              dc_id = dc_id or document.dc_id

              total_chunks = math.ceil(size / CHUNK)
              workers = max(1, min(workers, total_chunks))
              connections = max(1, min(connections, workers))

              print(f"Opening {connections} connection(s) to DC {dc_id}...")
              senders = await create_senders(client, dc_id, connections)
              print(f"Connections ready. Parallel requests: {workers}")
              print()

              try:
                  progress = Progress(size)

                  queue = asyncio.Queue()
                  for index in range(total_chunks):
                      queue.put_nowait(index)

                  with open(path, "wb") as f:
                      f.truncate(size)

                  async def worker(f, sender):
                      while True:
                          try:
                              index = queue.get_nowait()
                          except asyncio.QueueEmpty:
                              return

                          offset = index * CHUNK
                          expected = min(CHUNK, size - offset)
                          attempts = 0

                          while True:
                              try:
                                  result = await client._call(
                                      sender,
                                      GetFileRequest(
                                          location,
                                          offset=offset,
                                          limit=CHUNK,
                                      ),
                                  )

                                  data = getattr(result, "bytes", None)

                                  if data is None:
                                      raise Unsupported(
                                          "Unexpected getFile result "
                                          "(CDN redirect?)."
                                      )

                                  if len(data) != expected:
                                      raise RuntimeError(
                                          f"Chunk {index}: got {len(data)} "
                                          f"bytes, expected {expected}."
                                      )

                                  f.seek(offset)
                                  f.write(data)
                                  progress.add(len(data))
                                  break

                              except Unsupported:
                                  raise

                              except FloodWaitError as e:
                                  print(
                                      f"FloodWait: sleeping {e.seconds}s",
                                      flush=True,
                                  )
                                  await asyncio.sleep(e.seconds + 1)

                              except Exception as e:
                                  attempts += 1

                                  if attempts > MAX_RETRIES:
                                      raise

                                  print(
                                      f"Chunk error ({e!r}), "
                                      f"retry {attempts}/{MAX_RETRIES}",
                                      flush=True,
                                  )
                                  await asyncio.sleep(2 * attempts)

                  with open(path, "r+b") as f:
                      await run_all([
                          asyncio.create_task(
                              worker(f, senders[i % len(senders)])
                          )
                          for i in range(workers)
                      ])

                  progress.finish()

              finally:
                  await asyncio.gather(
                      *[s.disconnect() for s in senders],
                      return_exceptions=True,
                  )

              return path


          # ----------------------------------------
          # Method B: one connection, many parallel requests
          # (used as fallback)
          # ----------------------------------------
          async def fast_download(client, message, path, segments):
              size = message.document.size
              total_chunks = math.ceil(size / CHUNK)
              segments = max(1, min(segments, total_chunks))
              per_seg = math.ceil(total_chunks / segments)

              progress = Progress(size)

              # Pre-allocate the file so each segment can write at its own offset
              with open(path, "wb") as f:
                  f.truncate(size)

              async def worker(f, first, last):
                  cur = first
                  attempts = 0

                  while cur < last:
                      try:
                          async for data in client.iter_download(
                              message.media,
                              offset=cur * CHUNK,
                              limit=last - cur,
                              request_size=CHUNK,
                              file_size=size,
                          ):
                              f.seek(cur * CHUNK)
                              f.write(data)
                              cur += 1
                              progress.add(len(data))

                          if cur < last:
                              raise RuntimeError("Download stream ended early.")

                      except FloodWaitError as e:
                          print(f"FloodWait: sleeping {e.seconds}s", flush=True)
                          await asyncio.sleep(e.seconds + 1)

                      except Exception as e:
                          attempts += 1

                          if attempts > MAX_RETRIES:
                              raise

                          print(
                              f"Segment error ({e!r}), "
                              f"retry {attempts}/{MAX_RETRIES}",
                              flush=True,
                          )
                          await asyncio.sleep(2 * attempts)

              with open(path, "r+b") as f:
                  await run_all([
                      asyncio.create_task(
                          worker(
                              f,
                              i * per_seg,
                              min((i + 1) * per_seg, total_chunks),
                          )
                      )
                      for i in range(segments)
                      if i * per_seg < total_chunks
                  ])

              progress.finish()

              return path


          async def main():
              client = TelegramClient(
                  StringSession(SESSION),
                  API_ID,
                  API_HASH,
              )

              # connect() instead of start(): never waits for interactive login
              await client.connect()

              try:
                  if not await client.is_user_authorized():
                      raise RuntimeError(
                          "TELEGRAM_SESSION is invalid or expired. "
                          "Generate a new session string."
                      )

                  print("Connected to Telegram.")

                  # Private channels need the entity cache to be populated
                  if isinstance(PEER, int):
                      await client.get_dialogs()

                  print("Getting message...")

                  message = await client.get_messages(PEER, ids=MSG_ID)

                  if not message:
                      raise RuntimeError("Telegram message not found.")

                  if not message.media:
                      raise RuntimeError("This message does not contain media.")

                  original_name = message.file.name if message.file else None
                  print(f"Original file: {original_name or '(unnamed)'}")

                  if message.document and message.document.size:
                      print(f"File size: {format_size(message.document.size)}")
                      print()

                      done = False

                      if CONNECTIONS > 1 and MULTI_IMPORT_OK:
                          print("Mode: multi-connection")

                          try:
                              await multi_download(
                                  client,
                                  message,
                                  OUT,
                                  SEGMENTS,
                                  CONNECTIONS,
                              )
                              done = True

                          except Exception as e:
                              print()
                              print(f"Multi-connection download failed: {e!r}")
                              print("Falling back to single-connection mode.")
                              print()

                      if not done:
                          print(f"Mode: single connection, {SEGMENTS} segments")
                          await fast_download(client, message, OUT, SEGMENTS)

                  else:
                      print("Size unknown or not a document, using normal download.")

                      downloaded = await client.download_media(message, file=OUT)

                      if not downloaded:
                          raise RuntimeError("Telegram download returned no file.")

                      if os.path.abspath(downloaded) != os.path.abspath(OUT):
                          os.replace(downloaded, OUT)

                  if not os.path.isfile(OUT) or os.path.getsize(OUT) == 0:
                      raise RuntimeError("Downloaded file is missing or empty.")

                  print(f"Downloaded file: {os.path.abspath(OUT)}")

              finally:
                  await client.disconnect()


          if __name__ == "__main__":
              asyncio.run(main())
          PY

          python3 download.py

      # ----------------------------------------
      # 4. Inspect input
      # ----------------------------------------
      - name: Inspect media
        run: |

          if [ ! -s "$MEDIA_FILE" ]; then
            echo "Media file is missing or empty: $MEDIA_FILE"
            exit 1
          fi

          echo "================================"
          echo "Input media information"
          echo "================================"

          ffprobe \
            -hide_banner \
            -v error \
            -show_entries \
            format=duration,size,format_name \
            -show_entries \
            stream=index,codec_name,codec_type,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$MEDIA_FILE"

      # ----------------------------------------
      # 5. Cut videos (every cut comes from the one downloaded file)
      # ----------------------------------------
      - name: Cut selected sections
        run: |

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$MEDIA_FILE" || true)

          python3 - "$DURATION" <<'PY'
          import sys

          try:
              duration = float(sys.argv[1])
          except ValueError:
              print("Could not read the video duration, skipping range check.")
              sys.exit(0)


          def to_seconds(value):
              h, m, s = value.split(":")
              return int(h) * 3600 + int(m) * 60 + float(s)


          print(f"Video duration: {duration:.3f} seconds")

          with open("cuts.txt", encoding="utf-8") as f:
              for line in f:
                  start, end, name = line.rstrip("\n").split("\t")

                  if to_seconds(start) >= duration:
                      print(
                          f"ERROR: start of '{name}' ({start}) "
                          "is beyond the end of the video."
                      )
                      sys.exit(1)

                  if to_seconds(end) > duration:
                      print(
                          f"WARNING: end of '{name}' ({end}) is after the "
                          "end of the video, it will be cut at the end."
                      )
          PY

          mkdir -p out

          while IFS=$'\t' read -r START END NAME; do

            OUTPUT_FILE="out/${NAME}.mp4"

            echo "================================"
            echo "Cutting: $NAME"
            echo "================================"

            echo "Start: $START"
            echo "End:   $END"
            echo "Output: $OUTPUT_FILE"
            echo

            ffmpeg \
              -hide_banner \
              -nostdin \
              -ss "$START" \
              -to "$END" \
              -i "$MEDIA_FILE" \
              -map 0:v:0 \
              -map 0:a:0? \
              -c copy \
              -avoid_negative_ts make_zero \
              -movflags +faststart \
              -y \
              "$OUTPUT_FILE"

            echo

          done < cuts.txt

          echo "All cuts completed."

      # ----------------------------------------
      # 6. Verify output
      # ----------------------------------------
      - name: Verify output
        run: |

          while IFS=$'\t' read -r START END NAME; do

            OUTPUT_FILE="out/${NAME}.mp4"

            if [ ! -s "$OUTPUT_FILE" ]; then
              echo "Output file was not created or is empty: $OUTPUT_FILE"
              exit 1
            fi

            echo "================================"
            echo "Output information: $NAME"
            echo "================================"

            ls -lh "$OUTPUT_FILE"

            ffprobe \
              -hide_banner \
              -v error \
              -show_entries \
              format=duration,size,format_name \
              -show_entries \
              stream=index,codec_name,codec_type,width,height \
              -of default=noprint_wrappers=1 \
              "$OUTPUT_FILE" < /dev/null

            echo

          done < cuts.txt

      # ----------------------------------------
      # 7. Upload results
      # ----------------------------------------
      - name: Upload cut videos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 1
          # mp4 is already compressed; skipping zip compression is faster
          compression-level: 0

      # ----------------------------------------
      # 8. Cleanup
      # ----------------------------------------
      - name: Cleanup
        if: always()
        run: |

          rm -f download.py
          rm -f cuts.txt
          rm -f "$MEDIA_FILE"
          rm -rf out

          echo "Cleanup completed."
